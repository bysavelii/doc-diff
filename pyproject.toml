[project]
name = "doc-diff"
version = "0.1.0"
description = "Показывает, что изменилось между двумя версиями договора в PDF или DOCX"
requires-python = ">=3.12"
dependencies = [
    "pypdf[crypto]>=6",
    "python-docx>=1.2",
]

[project.scripts]
doc-diff = "doc_diff.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fpdf2>=2.8",
    "mypy",
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "RUF", "PT", "PL"]
# Тексты проекта русские, а эти правила считают кириллицу «похожими символами».
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
